# Builds the Android test app and checks the server on every push.
# The finished APK is attached to the run and published as a pre-release,
# so it can be downloaded straight onto a phone.
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Unit tests, lint and debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug

      # Lint findings in the log, so they can be read without downloading the report.
      - name: Summarise lint findings
        if: always()
        run: |
          python3 - <<'PY'
          import collections, os, xml.etree.ElementTree as ET
          path = "android/app/build/reports/lint-results-debug.xml"
          if not os.path.exists(path):
              print("No lint report."); raise SystemExit
          issues = list(ET.parse(path).getroot().iter("issue"))
          count = collections.Counter((i.get("severity"), i.get("id")) for i in issues)
          print(f"LINT: {len(issues)} findings")
          for (sev, rule), n in count.most_common():
              print(f"  {n:3d}  {sev:12s} {rule}")
          print("Details:")
          for i in issues:
              loc = i.find("location")
              where = f"{loc.get('file').split('/app/')[-1]}:{loc.get('line')}" if loc is not None else ""
              print(f"  [{i.get('severity')}] {i.get('id')} {where}: {i.get('message')[:220]}")
          PY

      # Reports stay available for every run, also when a step above failed.
      - name: Keep test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore

      - name: Name the APK after the build number
        run: cp android/app/build/outputs/apk/debug/app-debug.apk lobbyism-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: lobbyism-apk
          path: lobbyism-${{ github.run_number }}.apk
          if-no-files-found: error

      - name: Publish as pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "build-${{ github.run_number }}" "lobbyism-${{ github.run_number }}.apk"
          --prerelease
          --title "Testbuild ${{ github.run_number }}"
          --notes "Automatischer Testbuild aus Commit ${{ github.sha }}."

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Type-check, build and test the server module
        working-directory: server
        run: |
          npm ci
          npm run build
          test -s build/index.js
          npm test
